<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">CampusAI — AI-powered education platform</title>
  <desc id="desc">CampusAI logo: a circular blue mark with a mortarboard graduation cap and three sparkles, followed by the wordmark "Campus" in navy and "AI" in a bright blue gradient.</desc>
  <defs>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A6BFF"/>
      <stop offset="1" stop-color="#39C1FF"/>
    </linearGradient>
  </defs>

  <!-- Circular mark -->
  <g>
    <circle cx="100" cy="100" r="78" fill="#EAF4FF"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#1F6DB8" stroke-width="8"/>

    <!-- Mortarboard -->
    <g transform="translate(100 100)">
      <!-- Board -->
      <path d="M-52 8 L0 -22 L52 8 L0 38 Z" fill="#0E4E93"/>
      <!-- Center button -->
      <circle cx="0" cy="8" r="5" fill="#7CAFE5"/>
      <!-- Tassel, hanging to the right -->
      <path d="M0 8 L0 26" stroke="#0E4E93" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 8 L18 18" stroke="#0E4E93" stroke-width="3" stroke-linecap="round"/>
      <circle cx="22" cy="21" r="5" fill="#F59E0B"/>
      <!-- Base line under board -->
      <path d="M-10 22 L-10 36 Q0 44 10 36 L10 22" fill="none" stroke="#0E4E93" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Three sparkles to the right, inside the ring -->
    <g transform="translate(150 40)" fill="#1F6DB8">
      <path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/>
    </g>
    <g transform="translate(166 62)" fill="#7CAFE5">
      <path d="M0 -6.5 L1.6 -1.6 L6.5 0 L1.6 1.6 L0 6.5 L-1.6 1.6 L-6.5 0 L-1.6 -1.6 Z"/>
    </g>
    <g transform="translate(158 88)" fill="#5F9FDD">
      <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z"/>
    </g>
  </g>

  <!-- Wordmark: "Campus" navy + "AI" gradient -->
  <g font-family="'Poppins','Montserrat',-apple-system,'Segoe UI',sans-serif" font-size="72" font-weight="600" letter-spacing="-1">
    <text x="210" y="132">Campus</text>
    <text x="480" y="132" fill="url(#aiGrad)">AI</text>
  </g>
</svg>
